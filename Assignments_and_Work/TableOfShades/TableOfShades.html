<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colored Table</title>
    <link rel="stylesheet" href="./TableOfShades.css" />
  </head>
  <body>
    <h1>Create A Table of Shades</h1>
    <br />

    <table border="1">
      <td class="tableCell cell0">0</td>
      <td class="tableCell cell1">1</td>
      <td class="tableCell cell2">2</td>
      <td class="tableCell cell3">3</td>
      <td class="tableCell cell4">4</td>
      <td class="tableCell cell5">5</td>
      <td class="tableCell cell6">6</td>
      <td class="tableCell cell7">7</td>
      <td class="tableCell cell8">8</td>
      <td class="tableCell cell9">9</td>
    </table>
  </body>
</html>
