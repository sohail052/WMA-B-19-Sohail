<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Practice</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- We don't need css as we're already using bootstrap -->
  </head>
  <body>
    <h1 class="w-75 m-auto text-center">This is My Bootstrap Practice.</h1>
    <hr />

    <p class="w-50 m-auto text-center">I'll be practicing bootstrap here.</p>
    <br />
    <div class="container" style="border: 5px solid purple">
      <p class="bg-primary w-50 m-auto text-center">Primary is Blue</p>
      <p class="bg-danger w-50 m-auto text-center">Danger is Red</p>
      <p class="bg-warning w-50 m-auto text-center">Warning is Yellow</p>
      <p class="bg-success w-50 m-auto text-center">Success is Green</p>
      <p class="bg-dark text-white w-50 m-auto text-center">Dark is Black</p>
    </div>
  </body>
</html>
